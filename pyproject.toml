[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mingjian"
version = "0.1.0"
description = "MingJian: multimodal fake-news triage with explainable evidence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10.2",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.48",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]

[project.scripts]
mingjian-smoke = "mingjian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"